name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Build Nextshot
        run: make
      - name: Install shellcheck
        run: >-
          sc=shellcheck archive=$sc-stable.linux.x86_64.tar.xz
          dlpath="https://github.com/koalaman/${sc}/releases/download/stable"

          echo "::add-matcher::.github/problem-matcher-gcc.json";
          curl -L "${dlpath}/${archive}" -o ./sc.tar.xz && tar -xf $_ &&
          mv -v ./{${sc}-stable/,}$sc && echo "${sc^} $(./$sc -V | grep ^ver)"
      - run: ./shellcheck -P src -f gcc release src/*.bash
